name: Build MAVIS Windows installer
on:
  workflow_dispatch:
  pull_request:
    paths: ['mavis/**', 'run_mavis.py', 'windows_launcher.py', 'packaging/windows/**', '.github/workflows/windows-installer.yml']
env:
  PYTHONUTF8: "1"
concurrency:
  group: mavis-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Install media test tools
        run: choco install ffmpeg --no-progress -y
      - name: Native Windows regression tests
        run: python -m unittest discover -s tests -v
      - name: Build installer and check bundled runtime
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Install without launching first-run downloads
        shell: pwsh
        run: |
          $p = Start-Process dist/MAVIS-Windows-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA/Programs/MAVIS"
          & "$app/python/python.exe" -c 'import mavis, run_mavis, local_studio; from mavis.activation import machine_code; assert len(machine_code()) == 64'
          if ($LASTEXITCODE -ne 0) { throw 'Installed runtime failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: MAVIS-Windows-installer
          path: |
            dist/MAVIS-Windows-Setup.exe
            dist/MAVIS-Windows-SHA256SUMS.txt
